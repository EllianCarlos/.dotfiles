[package]
name = "ai-commit"
version = "0.1.0"
edition = "2021"
description = "Suggest a commit subject and body with a local Ollama model"

[dependencies]
git2 = { version = "0.20", default-features = false }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
lto = true
strip = true
