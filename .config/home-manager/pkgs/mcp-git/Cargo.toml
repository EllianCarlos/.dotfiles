[package]
name = "mcp-git"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing git repository tools via libgit2"

[dependencies]
chrono = "0.4"
# System libgit2 only: no vendored C, no https/ssh transports needed.
git2 = { version = "0.21", default-features = false }
rmcp = { version = "3.7", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[profile.release]
lto = true
strip = true
