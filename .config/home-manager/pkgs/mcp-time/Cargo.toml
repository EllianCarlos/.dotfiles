[package]
name = "mcp-time"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing current time and timezone conversion tools"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
rmcp = { version = "3.7", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[profile.release]
lto = true
strip = true
