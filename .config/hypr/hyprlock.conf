source = $HOME/.config/hypr/tty-colors.conf

$font    = JetBrains Mono
$display = Silkscreen

general {
  disable_loading_bar = true
  hide_cursor = true
}

background {
  monitor =
  color = $root          # flat black, no image, no blur
  blur_passes = 0
}

# LAYOUT — machine speech, lowercase, muted
label {
  monitor =
  text = layout · $LAYOUT
  color = $muted
  font_size = 14
  font_family = $font
  position = 32, -32
  halign = left
  valign = top
}

# TIME — display face (keep size a multiple of 8 so the pixel grid holds)
label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  color = $text
  font_size = 96
  font_family = $display
  position = -32, -16
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%a %d %b %Y" | tr '[:upper:]' '[:lower:]'
  color = $muted
  font_size = 14
  font_family = $font
  position = -36, -160
  halign = right
  valign = top
}

# USER — replaces the avatar image
label {
  monitor =
  text = cmd[update:0] echo "$USER@$(hostname)"
  color = $secondary
  font_size = 14
  font_family = $font
  position = 0, 24
  halign = center
  valign = center
}

# INPUT — the one focused element: 2px yellow, square, inset well
input-field {
  monitor =
  size = 360, 48
  rounding = 0
  outline_thickness = 2
  outer_color = $yellow
  inner_color = $void
  font_color = $text
  font_family = $font
  dots_size = 0.22
  dots_spacing = 0.35
  dots_center = false
  dots_rounding = 0      # square dots, like a block cursor
  fade_on_empty = false
  placeholder_text = <span foreground="##$mutedAlpha">› password</span>
  hide_input = false
  check_color = $green
  fail_color = $red
  fail_text = <span foreground="##$redAlpha">$FAIL · attempt $ATTEMPTS</span>
  capslock_color = $yellow
  shadow_passes = 0
  position = 0, -32
  halign = center
  valign = center
}

label {
  monitor =
  text = ↵ unlock · esc clear
  color = $faint
  font_size = 11
  font_family = $font
  position = 0, -88
  halign = center
  valign = center
}
