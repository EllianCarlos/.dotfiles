# TTY theme overrides for hyprland.
# Source this as the LAST line of hyprland.conf — later values win:
#   source = ~/.config/hypr/tty-theme.conf
# and replace `source = ~/.config/hypr/mocha.conf` with tty-colors.conf.

source = ~/.config/hypr/tty-colors.conf

general {
    gaps_in = 2
    gaps_out = 8
    border_size = 1                    # 1px rules; yellow = focus, nothing else
    col.active_border = $yellow
    col.inactive_border = $border
    col.nogroup_border = $border
    col.nogroup_border_active = $yellow
}

decoration {
    rounding = 0                       # square corners
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false                # blur is never used
    }
    shadow {
        enabled = true                 # hard offset block, no soft shadow
        range = 0
        render_power = 1
        offset = 3 3
        sharp = true
        color = $void
        color_inactive = $void
    }
}

group {
    col.border_active = $yellow
    col.border_inactive = $border
    groupbar {
        font_family = JetBrains Mono
        font_size = 11
        height = 18
        gradients = false
        text_color = $text
        col.active = $yellow
        col.inactive = $raised
    }
}

# Stepped, not eased. Hyprland has no steps(), so: linear curves,
# short durations, slide/wipe styles only. No popin, no overshoot.
animations {
    enabled = yes
    bezier = linear, 0, 0, 1, 1
    animation = windows, 1, 2, linear, slide
    animation = windowsOut, 1, 1, linear, slide
    animation = border, 1, 1, linear
    animation = borderangle, 0
    animation = fade, 1, 1, linear
    animation = workspaces, 1, 3, linear, slide
    animation = specialWorkspace, 1, 2, linear, slidevert
    animation = layers, 1, 1, linear, slide
}

misc {
    background_color = $root           # flat colour, no wallpaper needed
    disable_hyprland_logo = true
    disable_splash_rendering = true
    font_family = JetBrains Mono
}

# launcher: text-only, no app icons (TTY has no imagery)
unbind = SUPER, D
bind = SUPER, D, exec, wofi --show drun --insensitive --prompt "run"
