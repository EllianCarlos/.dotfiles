# TTY design system — palette for hyprland / hyprlock
# source this from hyprland.conf and hyprlock.conf (replaces mocha.conf)

$root      = rgb(0A0A09)
$panel     = rgb(121211)
$raised    = rgb(1A1A18)
$hover     = rgb(242422)
$border    = rgb(33332F)
$borderHi  = rgb(4A4A45)
$faint     = rgb(5E5E58)
$muted     = rgb(8C8C84)
$secondary = rgb(B4B4AC)
$text      = rgb(E8E8E3)
$void      = rgb(000000)

$yellow    = rgb(FFD400)
$yellowDim = rgb(8A7300)
$green     = rgb(5AF78E)
$cyan      = rgb(5EDFFF)
$magenta   = rgb(FF6AC1)
$red       = rgb(FF5C57)

# hex-only twins for pango markup (<span foreground="##$xAlpha">)
$textAlpha   = E8E8E3
$mutedAlpha  = 8C8C84
$yellowAlpha = FFD400
$redAlpha    = FF5C57
